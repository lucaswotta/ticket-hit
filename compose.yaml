name: ticket-hit

# Portas presas a 127.0.0.1: a infraestrutura fica acessível só a esta máquina.
services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina no .env}
      TICKETING_DB_PASSWORD: ${TICKETING_DB_PASSWORD:?defina no .env}
      PAYMENT_DB_PASSWORD: ${PAYMENT_DB_PASSWORD:?defina no .env}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?defina no .env}
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./infra/postgres/create-databases.sh:/docker-entrypoint-initdb.d/create-databases.sh:ro
    ports:
      - 127.0.0.1:5432:5432
    mem_limit: 512m
    healthcheck:
      test: pg_isready -U postgres -d postgres
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8.10.3-alpine
    # A fila é estado quente e reconstruível, então não há persistência em disco.
    # noeviction faz a escrita falhar quando a memória acaba, em vez de apagar
    # posições da fila em silêncio.
    command: >
      redis-server --requirepass ${REDIS_PASSWORD:?defina no .env}
      --save "" --appendonly no --maxmemory 256mb --maxmemory-policy noeviction
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    ports:
      - 127.0.0.1:6379:6379
    mem_limit: 320m
    healthcheck:
      test: redis-cli ping | grep -q PONG
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    image: apache/kafka:4.3.2
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # INTERNAL atende os containers; HOST atende os serviços rodando fora do Docker.
      KAFKA_LISTENERS: INTERNAL://:19092,HOST://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Tópico só existe se o serviço dono o declarar, com as partições do contrato.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    ports:
      - 127.0.0.1:9092:9092
    mem_limit: 1g
    # Cada checagem abre uma JVM: rápido só durante a subida, depois de minuto
    # em minuto, para não tirar CPU dos serviços.
    healthcheck:
      test: /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null
      start_period: 120s
      start_interval: 5s
      interval: 60s
      timeout: 10s
      retries: 3

  kafka-init:
    image: apache/kafka:4.3.2
    entrypoint: ["/bin/sh", "/create-topics.sh"]
    volumes:
      - ./infra/kafka/create-topics.sh:/create-topics.sh:ro
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    # O realm é importado só se ainda não existir; mudanças depois disso vão
    # pelo console ou pelo kcadm.
    command: start-dev --import-realm
    volumes:
      - ./infra/keycloak:/opt/keycloak/data/import:ro
    environment:
      KEYCLOAK_SIMULATOR_SECRET: ${KEYCLOAK_SIMULATOR_SECRET:?defina no .env}
      KEYCLOAK_SSL_REQUIRED: ${KEYCLOAK_SSL_REQUIRED:-external}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?defina no .env}
      KC_HEALTH_ENABLED: "true"
    depends_on:
      postgres:
        condition: service_healthy
    # 8080 fica reservada para o gateway.
    ports:
      - 127.0.0.1:8180:8080
    mem_limit: 1g
    healthcheck:
      # A imagem não traz curl; o bash abre a conexão HTTP direto.
      test:
        - CMD-SHELL
        - >
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"UP"' <&3
      interval: 10s
      timeout: 5s
      retries: 18

volumes:
  postgres-data:
