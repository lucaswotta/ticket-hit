# As versões ficam fixadas no projeto (actions por SHA, imagens por tag exata);
# o Dependabot abre PR quando sai versão nova, e o CI valida antes do merge.
version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    groups:
      maven:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
