name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Actions fixadas por SHA: uma tag pode ser movida para outro código, um commit não.
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 25
          cache: maven
      - run: ./mvnw -B verify

  infra:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Gerar .env com senhas descartáveis
        run: |
          grep -oE '^[A-Z_]+' .env.example | while read -r name; do
            echo "$name=$(openssl rand -hex 24)"
          done > .env
      - run: docker compose up -d --wait --wait-timeout 300
      # O --wait não espera containers de execução única, e o compose wait do
      # runner não acha container que já saiu. Espera o estado e exige saída 0.
      - name: Esperar a criação dos tópicos
        run: |
          timeout 120 sh -c 'until [ "$(docker compose ps -a --format "{{.State}}" kafka-init)" = exited ]; do sleep 1; done'
          test "$(docker compose ps -a --format "{{.ExitCode}}" kafka-init)" = 0
      - run: infra/smoke-test.sh
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down -v
