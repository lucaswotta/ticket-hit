spring:
  application:
    name: gateway
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
      password: ${REDIS_PASSWORD:}
  security:
    oauth2:
      resourceserver:
        jwt:
          # O emissor é o endereço público do Keycloak, que vai no token; as
          # chaves vêm pelo endereço interno, que pode ser outro dentro do Docker.
          issuer-uri: ${KEYCLOAK_ISSUER:http://localhost:8180/realms/ticket-hit}
          jwk-set-uri: ${KEYCLOAK_JWKS:http://localhost:8180/realms/ticket-hit/protocol/openid-connect/certs}
          audiences: ticket-hit-api
  cloud:
    gateway:
      server:
        webflux:
          httpclient:
            connect-timeout: 1000
            response-timeout: 5s
            pool:
              # Abaixo do keep-alive dos serviços: a conexão ociosa sai do pool
              # antes de o servidor fechá-la do outro lado.
              max-idle-time: 10s
          # GET é idempotente: se a conexão falhar antes da resposta, tenta uma
          # vez de novo. Status de resposta não entra (series vazia), para um 503
          # do serviço não virar duas chamadas.
          default-filters:
            - name: Retry
              args:
                retries: 1
                methods: GET
                series:
                exceptions: java.io.IOException
          # O payment não tem rota: só o ticketing fala com ele, pela rede interna.
          routes:
            - id: sales-public
              uri: ${TICKETING_URI:http://localhost:8082}
              predicates:
                - Method=GET
                - Path=/api/sales/*
              filters:
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@clientIpKeyResolver}"
                    redis-rate-limiter.replenishRate: ${gateway.rate-limit.ip.per-second}
                    redis-rate-limiter.burstCapacity: ${gateway.rate-limit.ip.burst}
            - id: queues-public
              uri: ${QUEUE_URI:http://localhost:8081}
              predicates:
                - Method=GET
                - Path=/api/queues/*
              filters:
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@clientIpKeyResolver}"
                    redis-rate-limiter.replenishRate: ${gateway.rate-limit.ip.per-second}
                    redis-rate-limiter.burstCapacity: ${gateway.rate-limit.ip.burst}
            - id: queue
              uri: ${QUEUE_URI:http://localhost:8081}
              predicates:
                - Path=/api/queues/**
              filters:
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@customerKeyResolver}"
                    redis-rate-limiter.replenishRate: ${gateway.rate-limit.customer.per-second}
                    redis-rate-limiter.burstCapacity: ${gateway.rate-limit.customer.burst}
            - id: simulator
              uri: ${SIMULATOR_URI:http://localhost:8085}
              predicates:
                - Path=/api/rooms/**
              filters:
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@customerKeyResolver}"
                    redis-rate-limiter.replenishRate: ${gateway.rate-limit.customer.per-second}
                    redis-rate-limiter.burstCapacity: ${gateway.rate-limit.customer.burst}
            - id: ticketing
              uri: ${TICKETING_URI:http://localhost:8082}
              predicates:
                - Path=/api/sales/**,/api/holds/**
              filters:
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@customerKeyResolver}"
                    redis-rate-limiter.replenishRate: ${gateway.rate-limit.customer.per-second}
                    redis-rate-limiter.burstCapacity: ${gateway.rate-limit.customer.burst}

server:
  port: 8080

gateway:
  rate-limit:
    # Por comprador: um navegador consulta a fila a cada segundo e faz poucas
    # chamadas de compra. Por IP: vários visitantes podem sair do mesmo NAT.
    customer:
      per-second: 5
      burst: 10
    ip:
      per-second: 50
      burst: 100
