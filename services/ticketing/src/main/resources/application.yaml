spring:
  application:
    name: ticketing
  datasource:
    url: jdbc:postgresql://${TICKETING_DB_HOST:localhost}:5432/ticketing
    username: ticketing
    password: ${TICKETING_DB_PASSWORD:}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ticketing
      auto-offset-reset: earliest
  mvc:
    problemdetails:
      enabled: true

server:
  port: 8082

ticketing:
  pass:
    # Chave pública EC P-256 da queue, X.509 DER em base64. Com ela o ticketing
    # confere o passe, mas não consegue emitir um.
    public-key: ${QUEUE_PASS_PUBLIC_KEY:}
    clock-skew: 5s
  hold:
    duration: 10m
    max-quantity: 4
    expiration-batch-size: 500
    expiration-interval: 1s
  payment:
    base-url: ${PAYMENT_BASE_URL:http://localhost:8083}
    # O pior caso precisa caber no response-timeout do gateway (5 s): três
    # tentativas de 1 s mais os backoffs de 200 e 400 ms dão 3,6 s.
    connect-timeout: 1s
    read-timeout: 1s
    max-retries: 2
    retry-delay: 200ms
  naive:
    # Intervalo entre ler e gravar no modo ingênuo, no lugar do trabalho que
    # código real faz ali (preço, regras, chamadas). É essa janela que abre a
    # corrida que a demo mostra; ver docs/adr/0001-estrategia-de-estoque.md.
    read-write-gap: 20ms
