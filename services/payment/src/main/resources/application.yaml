spring:
  application:
    name: payment
  datasource:
    url: jdbc:postgresql://${PAYMENT_DB_HOST:localhost}:5432/payment
    username: payment
    password: ${PAYMENT_DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      properties:
        enable.idempotence: true
  mvc:
    problemdetails:
      enabled: true

server:
  port: 8083

payment:
  batch-size: 100
  processing-interval: 200ms
  outbox-interval: 200ms
  fake:
    decision-delay: 1s
    decline-rate: 0.1
    unavailable-rate: 0.0
